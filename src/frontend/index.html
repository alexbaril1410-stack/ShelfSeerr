<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="ShelfSeerr - Book and audiobook discovery and requests" />
    <base href="/" data-shelfmark-base />

    <!-- Theme color with media queries for light/dark mode -->
    <meta name="theme-color" content="#f8f8f8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)" />

    <!-- iOS PWA Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ShelfSeerr" />

    <!-- App Icons -->
    <link rel="icon" type="image/png" href="shelfseerr-app-icon-512-transparent.png" />
    <link rel="apple-touch-icon" href="shelfseerr-icon.svg" />
    <title>ShelfSeerr</title>
    <script>
      // Apply theme before first paint to avoid a light/dark flash on load.
      (function () {
        var saved = localStorage.getItem('preferred-theme') || 'auto';
        var theme = saved === 'auto'
          ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
          : saved;
        var dark = theme === 'dark';
        var bg = dark ? '#121212' : '#f8f8f8';
        var fg = dark ? '#fff' : '#333';
        document.documentElement.setAttribute('data-theme', theme);
        document.documentElement.style.colorScheme = theme;
        var style = document.createElement('style');
        style.id = 'theme-init';
        style.textContent = 'html,body,#root{background:' + bg + ';color:' + fg + '}';
        document.head.appendChild(style);
        document.documentElement.classList.add('preload');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
